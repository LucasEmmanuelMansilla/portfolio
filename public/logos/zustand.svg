<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bearGradient" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a3b32" />
      <stop offset="100%" stop-color="#2b201a" />
    </radialGradient>
    
    <linearGradient id="muzzleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d7c2b0" />
      <stop offset="100%" stop-color="#b59e8c" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#1a1a1a" rx="30" />


  <circle cx="150" cy="140" r="55" fill="url(#bearGradient)" />
  <circle cx="150" cy="140" r="35" fill="#e8b4b8" opacity="0.8" />

  <circle cx="350" cy="140" r="55" fill="url(#bearGradient)" />
  <circle cx="350" cy="140" r="35" fill="#e8b4b8" opacity="0.8" />

  <ellipse cx="250" cy="240" rx="130" ry="115" fill="url(#bearGradient)" />

  <circle cx="200" cy="210" r="10" fill="#000000" />
  <circle cx="197" cy="207" r="3" fill="#ffffff" />

  <circle cx="300" cy="210" r="10" fill="#000000" />
  <circle cx="297" cy="207" r="3" fill="#ffffff" />

  <ellipse cx="250" cy="275" rx="55" ry="40" fill="url(#muzzleGradient)" />

  <path d="M 225 260 Q 250 250, 275 260 Q 275 275, 250 285 Q 225 275, 225 260 Z" fill="#1a120b" />
  
  <ellipse cx="242" cy="260" rx="6" ry="3" fill="#ffffff" opacity="0.6" />


</svg>
